name: Get Citation Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'google_scholar_crawler/**'
      - '.github/workflows/google_scholar_crawler.yaml'
      - '_pages/about.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Fetch previous citation stats
        continue-on-error: true
        run: |
          git fetch origin google-scholar-stats:google-scholar-stats || true
          mkdir -p google_scholar_crawler/previous_stats
          if git show google-scholar-stats:gs_data.json > google_scholar_crawler/previous_stats/gs_data.json 2>/dev/null; then
            echo "Loaded previous gs_data.json"
          fi
          if git show google-scholar-stats:gs_history.json > google_scholar_crawler/previous_stats/gs_history.json 2>/dev/null; then
            echo "Loaded previous gs_history.json"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd ./google_scholar_crawler
          pip install -r requirements.txt

      - name: Crawl Google Scholar
        run: |
          cd ./google_scholar_crawler
          python main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}

      - name: Publish citation stats
        run: |
          cd ./google_scholar_crawler/results
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          remote_repo="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add *.json
          git commit -m "Updated Citation Data"
          git push "${remote_repo}" HEAD:google-scholar-stats --force

name: Get Citation Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'google_scholar_crawler/**'
      - '.github/workflows/google_scholar_crawler.yaml'
      - '_pages/about.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Fetch previous citation stats
        continue-on-error: true
        run: |
          mkdir -p google_scholar_crawler/previous_stats
          if curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/google-scholar-stats/gs_data.json" \
            -o google_scholar_crawler/previous_stats/gs_data.json; then
            echo "Loaded previous gs_data.json"
            python -c "import json; d=json.load(open('google_scholar_crawler/previous_stats/gs_data.json')); print('previous source=', d.get('source'), 'citedby=', d.get('citedby'))"
          else
            echo "No previous gs_data.json found"
            rm -f google_scholar_crawler/previous_stats/gs_data.json
          fi
          if curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/google-scholar-stats/gs_history.json" \
            -o google_scholar_crawler/previous_stats/gs_history.json; then
            echo "Loaded previous gs_history.json"
          else
            rm -f google_scholar_crawler/previous_stats/gs_history.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd ./google_scholar_crawler
          pip install -r requirements.txt

      - name: Crawl Google Scholar
        run: |
          cd ./google_scholar_crawler
          python main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}

      - name: Publish citation stats
        run: |
          cd ./google_scholar_crawler/results
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          remote_repo="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add *.json
          git commit -m "Updated Citation Data"
          git push "${remote_repo}" HEAD:google-scholar-stats --force
